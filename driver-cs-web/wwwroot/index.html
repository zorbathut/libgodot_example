<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
    <title>Godot C# Web Export</title>
    <style>
        html, body, #canvas {
            margin: 0;
            padding: 0;
            border: 0;
        }

        body {
            color: white;
            background-color: black;
            overflow: hidden;
            touch-action: none;
            font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
        }

        #canvas {
            display: block;
        }

        #canvas:focus {
            outline: none;
        }

        #status {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            max-width: 80%;
        }

        #status.hidden {
            display: none;
        }

        #log {
            position: absolute;
            left: 10px;
            top: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #0f0;
            font-family: monospace;
            font-size: 12px;
            padding: 10px;
            max-height: 200px;
            overflow-y: auto;
            max-width: 500px;
            display: none; /* Hidden by default, enable for debugging */
        }

        .error {
            color: #f44;
        }
    </style>
</head>
<body>
    <canvas id="canvas">
        Your browser does not support the canvas tag.
    </canvas>

    <div id="status">
        <p id="status-text">Loading .NET Runtime...</p>
    </div>

    <div id="log"></div>

    <noscript>
        Your browser does not support JavaScript.
    </noscript>

    <script type="module">
        const statusDiv = document.getElementById('status');
        const statusText = document.getElementById('status-text');
        const logDiv = document.getElementById('log');

        function log(message, isError = false) {
            console.log(message);
            const line = document.createElement('div');
            line.textContent = message;
            if (isError) {
                line.classList.add('error');
                console.error(message);
            }
            logDiv.appendChild(line);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function updateStatus(message) {
            statusText.textContent = message;
            log(message);
        }

        function hideStatus() {
            statusDiv.classList.add('hidden');
        }

        async function preloadFile(filename) {
            updateStatus(`Preloading ${filename}...`);

            try {
                const response = await fetch(filename);
                if (!response.ok) {
                    throw new Error(`Failed to fetch ${filename}: ${response.statusText}`);
                }

                const buffer = await response.arrayBuffer();
                log(`Preloaded ${filename}: ${buffer.byteLength} bytes`);

                // Write the file to Godot's filesystem using Module.copyToFS
                // This is the proper Godot API for writing files
                if (typeof Module !== 'undefined' && typeof Module.copyToFS === 'function') {
                    log(`Module.copyToFS exists, writing file...`);

                    Module.copyToFS(filename, buffer);
                    log(`Wrote ${filename} to Godot filesystem using copyToFS`);

                    // Verify the file was written
                    if (Module.FS) {
                        try {
                            const stat = Module.FS.stat(filename);
                            log(`File ${filename} exists with size: ${stat.size} bytes`);
                        } catch (e) {
                            log(`Error verifying file: ${e.message}`, true);
                        }
                    }
                } else {
                    log(`Module type: ${typeof Module}`, true);
                    log(`Module.copyToFS type: ${typeof (Module && Module.copyToFS)}`, true);
                    throw new Error('Module.copyToFS not available');
                }

                return buffer;
            } catch (error) {
                log(`Error preloading ${filename}: ${error.message}`, true);
                throw error;
            }
        }

        async function loadAndStartGodot() {
            try {
                updateStatus('Loading .NET Runtime...');

                // Import .NET WASM runtime
                // The path will need to be adjusted based on where dotnet.js is located
                const { dotnet } = await import('./_framework/dotnet.js');

                updateStatus('Initializing .NET Runtime...');

                // Initialize .NET runtime
                const { setModuleImports, getAssemblyExports, getConfig, Module } = await dotnet
                    .withDiagnosticTracing(false)
                    .withApplicationArgumentsFromQuery()
                    .create();

                updateStatus('.NET Runtime initialized');

                // Make Module available globally so preloadFile can access FS
                globalThis.Module = Module;

                // Preload the .pck file before initializing Godot
                await preloadFile('project.pck');

                // Get the exports from our C# assembly
                const config = getConfig();
                const exports = await getAssemblyExports(config.mainAssemblyName);

                // Make C# exports available globally for main.js
                globalThis.GodotLauncher = exports.GodotLauncher;

                updateStatus('Initializing Godot...');

                const result = globalThis.GodotLauncher.InitializeGodot();

                if (result !== 0) {
                    throw new Error(`Godot initialization failed with code ${result}`);
                }

                updateStatus('Godot initialized successfully!');
                setTimeout(hideStatus, 1000);

            } catch (error) {
                log(`Error: ${error.message}`, true);
                updateStatus(`Error: ${error.message}`);
                console.error('Failed to start:', error);
            }
        }

        // Start loading when page is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', loadAndStartGodot);
        } else {
            loadAndStartGodot();
        }
    </script>
</body>
</html>
